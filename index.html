<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#4f6ef7">
  <meta name="description" content="百宝箱 — 你的个人集成工具箱">
  <title>百宝箱</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header class="app-header" id="appHeader"></header>
  <main id="page" class="page"></main>

  <script src="js/icons.js"></script>
  <script src="js/store.js"></script>
  <script src="js/core.js"></script>
  <script src="js/qr.js"></script>
  <!-- 工具模块：每加一个新工具，在这里加一行 -->
  <script src="tools/todo.js"></script>
  <script src="tools/habit.js"></script>
  <script src="tools/water.js"></script>
  <script src="tools/pomodoro.js"></script>
  <script src="tools/calc.js"></script>
  <script src="tools/loan.js"></script>
  <script src="tools/bmi.js"></script>
  <script src="tools/ratio.js"></script>
  <script src="tools/password.js"></script>
  <script src="tools/qr.js"></script>
  <script src="tools/world.js"></script>
  <script src="tools/timer.js"></script>
  <script src="tools/days.js"></script>
  <script src="tools/decide.js"></script>
  <script src="tools/notes.js"></script>
  <script src="tools/mood.js"></script>
  <script src="tools/shopping.js"></script>
  <script src="tools/expense.js"></script>
  <script src="tools/backup.js"></script>
  <script>
    // 注册 Service Worker（file:// 打开时跳过）
    if ('serviceWorker' in navigator && location.protocol !== 'file:') {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(() => {});
      });
    }
    App.boot();
  </script>
</body>
</html>
